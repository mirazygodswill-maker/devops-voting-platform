apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote
spec:
  replicas: 2

  selector:
    matchLabels:
      app: vote

  template:
    metadata:
      labels:
        app: vote

    spec:
      containers:
      - name: vote
        image: 686699774218.dkr.ecr.us-east-1.amazonaws.com/vote:latest

        ports:
        - containerPort: 80

        env:
        - name: REDIS_HOST
          value: redis-service

        - name: OPTION_A
          value: Cats

        - name: OPTION_B
          value: Dogs
