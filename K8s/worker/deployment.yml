apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1

  selector:
    matchLabels:
      app: worker

  template:
    metadata:
      labels:
        app: worker

    spec:
      containers:
      - name: worker
        image: 686699774218.dkr.ecr.us-east-1.amazonaws.com/worker:latest

        env:
        - name: REDIS_HOST
          value: redis-service

        - name: DB_HOST
          value: postgres-service

        - name: DB_USERNAME
          value: postgres

        - name: DB_PASSWORD
          value: postgres

        - name: DB_NAME
          value: postgres
