apiVersion: apps/v1
kind: Deployment

metadata:
  name: result

spec:
  replicas: 1

  selector:
    matchLabels:
      app: result

  template:
    metadata:
      labels:
        app: result

    spec:
      containers:
      - name: result
        image: 686699774218.dkr.ecr.us-east-1.amazonaws.com/result:latest

        ports:
        - containerPort: 80

        env:
        - name: POSTGRES_HOST
          value: postgres-service

        - name: POSTGRES_USER
          value: postgres

        - name: POSTGRES_PASSWORD
          value: postgres

        - name: POSTGRES_DB
          value: postgres
