name: CI/CD Pipeline for Miracle Voting App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push vote image
        run: |
          docker build -t mirazygodswill/vote:latest ./vote
          docker push mirazygodswill/vote:latest

      - name: Build and push result image
        run: |
          docker build -t mirazygodswill/result:latest ./result
          docker push mirazygodswill/result:latest

      - name: Build and push worker image
        run: |
          docker build -t mirazygodswill/worker:latest ./worker
          docker push mirazygodswill/worker:latest